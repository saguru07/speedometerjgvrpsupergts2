<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JGVRP Speedometer HUD</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="hud booting" id="hud">
    <div class="main">
      <div class="speed" id="speed"><span class="dim">0</span><span class="dim">0</span><span>0</span></div>

      <div class="center">
        <div class="gear" id="gear">N</div>
        <div id="speed-mode" class="unit">MPH</div>
        <div class="odo"><span id="odometer">0.0</span> <span id="odo-unit">mi</span></div>
      </div>

      <div class="stats">
        <div id="fuel-group" class="stat">
          <svg class="stat-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 11h-1V3c0-.55-.45-1-1-1H7c-.55 0-1 .45-1 1v18h12c.55 0 1-.45 1-1v-6c0-1.66-1.34-3-3-3zm-3 2c.55 0 1 .45 1 1v4h-2v-5h1zM8 4h8v5H8V4z"/>
          </svg>
          <span id="fuel-value" class="stat-value">--</span><span class="pct">%</span>
        </div>
        <div id="health-group" class="stat">
          <svg class="stat-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M22 12c0-.6-.4-1-1-1h-2V9c0-.6-.4-1-1-1h-2V5c0-.6-.4-1-1-1H9c-.6 0-1 .4-1 1v3H6c-.6 0-1 .4-1 1v2H3c-.6 0-1 .4-1 1v3c0 .6.4 1 1 1h2v2c0 .6.4 1 1 1h12c.6 0 1-.4 1-1v-2h2c.6 0 1-.4 1-1v-3zM10 6h4v2h-4V6z"/>
          </svg>
          <span id="health-value" class="stat-value">--</span><span class="pct">%</span>
        </div>
      </div>
    </div>

    <!-- Bar RPM bersegmen (dibuat oleh script.js) -->
    <div class="rpm" id="rpm"></div>

    <!-- Intro: animasi ANNIS (otomatis diganti logo.png jika file ada) -->
    <div id="intro" class="intro">
      <div id="brand" class="brand" aria-label="ANNIS"></div>
    </div>

    <!-- Indikator bawah -->
    <div class="icons">
      <div id="sig-left" class="icon" title="Sein kiri">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      </div>
      <div id="sig-right" class="icon" title="Sein kanan">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </div>
      <div id="headlight" class="icon headlight" title="Lampu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 6a6 6 0 0 1 6 6 6 6 0 0 1-6 6V6z"/>
          <g class="beam-low"><line x1="3" y1="9" x2="7" y2="10"/><line x1="3" y1="12" x2="7" y2="12"/><line x1="3" y1="15" x2="7" y2="14"/></g>
          <g class="beam-high"><line x1="2" y1="8" x2="7" y2="8"/><line x1="2" y1="12" x2="7" y2="12"/><line x1="2" y1="16" x2="7" y2="16"/></g>
        </svg>
      </div>
      <div id="seatbelts" class="icon" title="Sabuk pengaman">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <circle cx="12" cy="4" r="2.2"/>
          <path d="M8 8h8l1 7h-2l-.5 7h-5L9 15H7z" opacity=".9"/>
          <path d="M7.5 8.5 16.5 17" stroke="#000" stroke-width="1.6"/>
        </svg>
      </div>
      <div id="engine" class="icon" title="Mesin">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M22 12c0-.6-.4-1-1-1h-2V9c0-.6-.4-1-1-1h-2V5c0-.6-.4-1-1-1H9c-.6 0-1 .4-1 1v3H6c-.6 0-1 .4-1 1v2H3c-.6 0-1 .4-1 1v3c0 .6.4 1 1 1h2v2c0 .6.4 1 1 1h12c.6 0 1-.4 1-1v-2h2c.6 0 1-.4 1-1v-3zM10 6h4v2h-4V6z"/>
        </svg>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
